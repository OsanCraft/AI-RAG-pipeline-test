version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      # Persists downloaded models between container restarts - without this,
      # every "docker compose up" would re-download qwen2.5:3b and nomic-embed-text
      # from scratch, which is a couple GB every time.
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # One-off helper: pulls the required models into the ollama service, then exits.
  # This runs once and stops - it's not a long-running server like the others.
  ollama-init:
    image: ollama/ollama:latest
    container_name: rag_ollama_init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3 && ollama pull qwen2.5:3b && ollama pull nomic-embed-text"]

  backend:
    build:
      context: ./backend
    container_name: rag_backend
    ports:
      - "5050:5050"
    volumes:
      - ./backend/contextfolder:/app/contextfolder
      - ./backend/embeddings_cache.pkl:/app/embeddings_cache.pkl
    environment:
      # "ollama" here is the service name above - Docker Compose gives every
      # service a DNS name matching its key, resolvable by other containers
      # on the same network. No host.docker.internal needed anymore since
      # Ollama now lives inside this same Docker network.
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: rag_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
